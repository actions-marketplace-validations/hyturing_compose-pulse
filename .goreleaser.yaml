version: 2

project_name: cpulse

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cpulse
    binary: cpulse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: hyturing
    name: compose-pulse
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Tag}}"

brews:
  - name: cpulse
    directory: Formula
    repository:
      owner: hyturing
      name: homebrew-cpulse
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: hyturing
      email: hyturing@gmail.com
    homepage: "https://github.com/hyturing/compose-pulse"
    description: "Real-time terminal UI for Docker Compose dependency graphs"
    license: "MIT"
    install: |
      bin.install "cpulse"
    test: |
      assert_match "cpulse", shell_output("#{bin}/cpulse --version")
